name: YiyiCoding
options:
  bundleIdPrefix: com.jobpassion
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  YiyiCoding:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes:
          - Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobpassion.yiyicoding
        PRODUCT_NAME: 一一编程乐园
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    preBuildScripts:
      - name: Generate iOS App Icon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ICON_SRC="$SRCROOT/../src/icon/ScratchDesktop.png"
          ICON_DST="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "error: 找不到图标源文件：$ICON_SRC"
            exit 1
          fi
          /usr/bin/sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          WIDTH=$(/usr/bin/sips -g pixelWidth "$ICON_DST" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(/usr/bin/sips -g pixelHeight "$ICON_DST" | awk '/pixelHeight/ {print $2}')
          if [ "$WIDTH" != "1024" ] || [ "$HEIGHT" != "1024" ]; then
            echo "error: iOS AppIcon 尺寸错误：${WIDTH}x${HEIGHT}"
            exit 1
          fi
          echo "Generated iOS AppIcon: ${WIDTH}x${HEIGHT}"
      - name: Build Scratch Web
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use --silent 22 >/dev/null 2>&1 || true
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "error: 找不到 npm。请确认已通过 nvm 安装 Node 22。"
            exit 1
          fi
          cd "$SRCROOT/.."
          if [ ! -d node_modules ]; then
            echo "error: node_modules 不存在，请先在仓库根目录运行 npm ci"
            exit 1
          fi
          npm run build:ios:web
    postBuildScripts:
      - name: Copy Scratch Web Into App Bundle
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WEB_SRC="$SRCROOT/App/Web"
          WEB_DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"
          if [ ! -f "$WEB_SRC/index.html" ]; then
            echo "error: iOS Web 资源未生成：$WEB_SRC/index.html"
            exit 1
          fi
          rm -rf "$WEB_DST"
          mkdir -p "$WEB_DST"
          ditto "$WEB_SRC" "$WEB_DST"
          echo "Copied Scratch Web resources to $WEB_DST"
