name: Build Velxio libqemu ESP32

on:
  workflow_dispatch:
    inputs:
      source_asset:
        description: "Optional exact Velxio asset name qemu-source-<commit>; leave blank to auto-detect when the manifest contains exactly one"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/build-libqemu-esp32.yml"
      - "patches/qemu/**"

permissions:
  contents: read

jobs:
  build-libqemu-xtensa-arm64:
    name: Build Velxio libqemu-xtensa.so (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      VELXIO_LICENSE_KEY: ${{ secrets.VELXIO_LICENSE_KEY }}
      VELXIO_DOWNLOAD_BASE: https://velxio.dev/api/pro/license/downloads

    steps:
      - name: Checkout scratch-desktop patches
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -a
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Check Velxio source access
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          set -euo pipefail

          if [ -z "${VELXIO_LICENSE_KEY:-}" ]; then
            echo "::error::Missing repository secret VELXIO_LICENSE_KEY. Create a free Velxio personal key, then add it as Actions secret VELXIO_LICENSE_KEY."
            exit 1
          fi

          curl -fsSL \
            "${VELXIO_DOWNLOAD_BASE}?key=${VELXIO_LICENSE_KEY}" \
            -o velxio-downloads.json

          SOURCE_ASSET="${REQUESTED_SOURCE_ASSET:-}"
          if [ -z "$SOURCE_ASSET" ]; then
            SOURCE_ASSET="$(python3 - <<'PY'
import re
from pathlib import Path

text = Path('velxio-downloads.json').read_text(encoding='utf-8')
assets = sorted(set(re.findall(r'qemu-source-[0-9a-fA-F]{7,40}', text)))
if len(assets) != 1:
    raise SystemExit(
        'Could not auto-select Velxio QEMU source archive: found '
        f'{len(assets)} candidates: {assets}. Re-run the workflow and set source_asset explicitly.'
    )
print(assets[0])
PY
)"
          fi

          if ! [[ "$SOURCE_ASSET" =~ ^qemu-source-[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::Invalid source_asset: $SOURCE_ASSET"
            exit 1
          fi

          echo "Using Velxio source asset: $SOURCE_ASSET"
          echo "source_asset=$SOURCE_ASSET" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SOURCE_ASSET" > VELXIO_QEMU_SOURCE_ASSET.txt

      - name: Download corresponding Velxio QEMU source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ASSET='${{ steps.source.outputs.source_asset }}'

          curl -fSL \
            -o velxio-qemu-source.tar.gz \
            "${VELXIO_DOWNLOAD_BASE}/${SOURCE_ASSET}?key=${VELXIO_LICENSE_KEY}"

          sha256sum velxio-qemu-source.tar.gz | tee VELXIO_QEMU_SOURCE_SHA256.txt
          tar -tzf velxio-qemu-source.tar.gz | head -40 | tee VELXIO_QEMU_SOURCE_HEAD.txt

          rm -rf qemu-velxio
          mkdir qemu-velxio
          tar -xzf velxio-qemu-source.tar.gz -C qemu-velxio --strip-components=1

          test -f qemu-velxio/build_libqemu-esp32.sh
          test -f qemu-velxio/hw/ssi/esp32_rmt.c

          # These files/machine names distinguish the Velxio source tree from
          # stock lcgamboa/qemu, which is not a drop-in replacement.
          if [ ! -f qemu-velxio/hw/ssi/esp32s3_gpspi.c ]; then
            echo "::error::Downloaded source does not look like the Velxio corresponding source tree (missing hw/ssi/esp32s3_gpspi.c)."
            exit 1
          fi
          grep -R -n -m1 'esp32s3-picsimlab' qemu-velxio/hw | tee VELXIO_MACHINE_CHECK.txt

      - name: Install QEMU build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl \
            python3-pip python3-setuptools \
            ninja-build pkg-config flex bison \
            libglib2.0-dev libgcrypt20-dev libslirp-dev \
            libpixman-1-dev libfdt-dev zlib1g-dev jq dpkg-dev

          python3 -m pip install --user 'meson==1.2.3' tomli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          LIBDIR="$(dpkg-architecture -q DEB_HOST_MULTIARCH)"
          sudo ar rcs "/usr/lib/${LIBDIR}/libiconv.a"

      - name: Inspect original ESP32 RMT terminator path
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 14 -E 'if[[:space:]]*\([[:space:]]*v[[:space:]]*==[[:space:]]*0|picsimlab_rmt_event' \
            qemu-velxio/hw/ssi/esp32_rmt.c \
            | tee RMT_BEFORE_PATCH.txt

      - name: Apply RMT frame-end patch
        shell: bash
        run: |
          set -euo pipefail
          cd qemu-velxio
          patch -p1 --forward < ../patches/qemu/esp32-rmt-forward-tx-terminator.patch

          grep -q 'picsimlab_rmt_event(channel, s->conf0\[channel\], 0);' \
            hw/ssi/esp32_rmt.c
          grep -n -C 14 -E 'if[[:space:]]*\([[:space:]]*v[[:space:]]*==[[:space:]]*0|picsimlab_rmt_event' \
            hw/ssi/esp32_rmt.c \
            | tee ../RMT_AFTER_PATCH.txt

      - name: Build shared library
        working-directory: qemu-velxio
        shell: bash
        run: |
          set -euo pipefail
          bash build_libqemu-esp32.sh

      - name: Verify artifact and Velxio callback ABI
        shell: bash
        run: |
          set -euo pipefail
          LIB=qemu-velxio/build/libqemu-xtensa.so
          test -f "$LIB"
          ls -lh "$LIB"
          file "$LIB" | tee LIBQEMU_FILE.txt
          file "$LIB" | grep -Eq 'ARM aarch64|aarch64'

          nm -D "$LIB" \
            | grep -E 'qemu_(init|main_loop|cleanup|picsimlab_register_callbacks|picsimlab_set_pin|picsimlab_uart_receive)' \
            | tee LIBQEMU_EXPORTS.txt

          grep -q 'qemu_picsimlab_register_callbacks' LIBQEMU_EXPORTS.txt
          strings "$LIB" | grep -m1 'esp32-picsimlab' | tee LIBQEMU_MACHINE.txt

      - name: Upload patched Velxio libqemu artifact
        uses: actions/upload-artifact@v4
        with:
          name: velxio-libqemu-xtensa-arm64-rmt-frame-end-${{ steps.source.outputs.source_asset }}
          path: |
            qemu-velxio/build/libqemu-xtensa.so
            VELXIO_QEMU_SOURCE_ASSET.txt
            VELXIO_QEMU_SOURCE_SHA256.txt
            VELXIO_QEMU_SOURCE_HEAD.txt
            VELXIO_MACHINE_CHECK.txt
            LIBQEMU_FILE.txt
            LIBQEMU_EXPORTS.txt
            LIBQEMU_MACHINE.txt
            RMT_BEFORE_PATCH.txt
            RMT_AFTER_PATCH.txt
          if-no-files-found: error
          retention-days: 14
