name: Build libqemu ESP32

on:
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: "lcgamboa/qemu branch, tag, or commit"
        required: true
        default: "picsimlab-esp32"
  push:
    paths:
      - ".github/workflows/build-libqemu-esp32.yml"
      - "patches/qemu/**"

permissions:
  contents: read

jobs:
  build-libqemu-xtensa:
    name: Build libqemu-xtensa.so (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      QEMU_REF: ${{ inputs.qemu_ref || 'picsimlab-esp32' }}

    steps:
      - name: Checkout scratch-desktop patches
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -a
          uname -m

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3-pip ninja-build pkg-config flex bison \
            gcc g++ make \
            libglib2.0-dev libgcrypt20-dev libslirp-dev \
            libpixman-1-dev libfdt-dev
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone lcgamboa QEMU
        run: |
          git clone https://github.com/lcgamboa/qemu.git qemu-lcgamboa
          cd qemu-lcgamboa
          git checkout "$QEMU_REF"
          echo "QEMU_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > ../QEMU_COMMIT.txt
          uname -m > ../BUILD_ARCH.txt

      - name: Locate ESP32 RMT callback
        run: |
          grep -R -n -C 16 -E 'picsimlab_rmt_event|rmt_event' \
            qemu-lcgamboa/hw qemu-lcgamboa/include 2>/dev/null \
            | tee RMT_LOCATIONS.txt || true

      - name: Apply local QEMU patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/qemu/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no QEMU patches found" >&2
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git -C qemu-lcgamboa apply --check "../$patch"
            git -C qemu-lcgamboa apply "../$patch"
          done
          git -C qemu-lcgamboa diff --check
          git -C qemu-lcgamboa diff -- hw/ssi/esp32_rmt.c | tee QEMU_APPLIED.diff
          grep -q 'picsimlab_rmt_event(channel, s->conf0\[channel\], 0);' \
            qemu-lcgamboa/hw/ssi/esp32_rmt.c

      - name: Build shared library
        working-directory: qemu-lcgamboa
        run: |
          bash build_libqemu-esp32.sh

      - name: Verify artifact
        run: |
          test -f qemu-lcgamboa/build/libqemu-xtensa.so
          ls -lh qemu-lcgamboa/build/libqemu-xtensa.so
          file qemu-lcgamboa/build/libqemu-xtensa.so | tee LIBQEMU_FILE.txt
          nm -D qemu-lcgamboa/build/libqemu-xtensa.so | grep -E 'qemu_(init|main_loop|picsimlab)' | head -50 || true
          echo "Built from lcgamboa/qemu commit: $QEMU_COMMIT"
          echo "Requested artifact architecture: ${{ matrix.arch }}"

      - name: Upload libqemu artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-xtensa-${{ matrix.arch }}-rmt-frame-end-${{ env.QEMU_COMMIT }}
          path: |
            qemu-lcgamboa/build/libqemu-xtensa.so
            QEMU_COMMIT.txt
            BUILD_ARCH.txt
            LIBQEMU_FILE.txt
            QEMU_APPLIED.diff
            RMT_LOCATIONS.txt
          if-no-files-found: error
          retention-days: 14
