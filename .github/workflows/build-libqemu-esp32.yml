name: Build Velxio libqemu ESP32

on:
  workflow_dispatch:
    inputs:
      source_asset:
        description: "Optional exact Velxio asset name qemu-source-<commit>; leave blank to select the newest corresponding source"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/build-libqemu-esp32.yml"
      - "patches/qemu/**"

permissions:
  contents: read

jobs:
  build-libqemu-xtensa-arm64:
    name: Build Velxio libqemu-xtensa.so (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      VELXIO_LICENSE_KEY: ${{ secrets.VELXIO_LICENSE_KEY }}
      VELXIO_DOWNLOAD_BASE: https://velxio.dev/api/pro/license/downloads

    steps:
      - name: Checkout scratch-desktop patches
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -a
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Select Velxio QEMU source
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          set -euo pipefail

          if [ -z "${VELXIO_LICENSE_KEY:-}" ]; then
            echo "::error::Missing repository secret VELXIO_LICENSE_KEY."
            exit 1
          fi

          curl -fsSL \
            "${VELXIO_DOWNLOAD_BASE}?key=${VELXIO_LICENSE_KEY}" \
            -o velxio-downloads.json

          SOURCE_ASSET="${REQUESTED_SOURCE_ASSET:-}"
          if [ -z "$SOURCE_ASSET" ]; then
            mapfile -t SOURCE_ASSETS < <(
              grep -oE 'qemu-source-[0-9a-fA-F]{7,40}' velxio-downloads.json | sort -u
            )
            if [ "${#SOURCE_ASSETS[@]}" -eq 0 ]; then
              echo "::error::No qemu-source-* assets found in the Velxio download manifest."
              exit 1
            fi

            echo "Source candidates: ${SOURCE_ASSETS[*]}"

            curl -fSL \
              -o reference-libqemu-xtensa.so \
              "${VELXIO_DOWNLOAD_BASE}/libqemu-xtensa-arm64?key=${VELXIO_LICENSE_KEY}"
            REF_SHA="$(sha256sum reference-libqemu-xtensa.so | awk '{print $1}')"
            echo "Current arm64 libqemu sha256: $REF_SHA"
            printf '%s\n' "$REF_SHA" > VELXIO_REFERENCE_LIB_SHA256.txt

            MATCHES=()
            LATEST_DATE=""
            LATEST_ASSET=""
            rm -f VELXIO_SOURCE_README_SUMMARY.txt

            for candidate in "${SOURCE_ASSETS[@]}"; do
              echo "Inspecting $candidate ..."
              tmp="source-${candidate}.tar.gz"
              curl -fSL \
                -o "$tmp" \
                "${VELXIO_DOWNLOAD_BASE}/${candidate}?key=${VELXIO_LICENSE_KEY}"

              readme_path="$(tar -tzf "$tmp" | grep -E '(^|/)README\.VELXIO-SOURCE\.md$' | head -1 || true)"
              if [ -z "$readme_path" ]; then
                echo "$candidate: README.VELXIO-SOURCE.md not found" | tee -a VELXIO_SOURCE_README_SUMMARY.txt
                continue
              fi

              readme_file="${candidate}.README.VELXIO-SOURCE.md"
              tar -xOzf "$tmp" "$readme_path" > "$readme_file"
              echo "===== $candidate =====" >> VELXIO_SOURCE_README_SUMMARY.txt
              grep -Ei 'commit|libqemu-xtensa|arm64|sha256|binary|correspond|version' \
                "$readme_file" \
                | head -100 >> VELXIO_SOURCE_README_SUMMARY.txt || true

              if grep -qi "$REF_SHA" "$readme_file"; then
                MATCHES+=("$candidate")
                cp "$tmp" velxio-qemu-source.tar.gz
              fi

              commit_date="$(grep -E '^- Commit date:' "$readme_file" | head -1 | sed -E 's/.*: *//' | tr -d '\r' || true)"
              if [[ "$commit_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "$candidate commit date: $commit_date"
                if [ -z "$LATEST_DATE" ] || [[ "$commit_date" > "$LATEST_DATE" ]]; then
                  LATEST_DATE="$commit_date"
                  LATEST_ASSET="$candidate"
                fi
              fi
            done

            cat VELXIO_SOURCE_README_SUMMARY.txt || true

            if [ "${#MATCHES[@]}" -eq 1 ]; then
              SOURCE_ASSET="${MATCHES[0]}"
              echo "Selected exact SHA-matched source: $SOURCE_ASSET"
            elif [ "${#MATCHES[@]}" -gt 1 ]; then
              echo "::error::Multiple source archives claim current binary sha256 $REF_SHA: ${MATCHES[*]}"
              exit 1
            else
              if [ -z "$LATEST_ASSET" ]; then
                echo "::error::No binary SHA match and no parseable source commit dates."
                exit 1
              fi
              SOURCE_ASSET="$LATEST_ASSET"
              cp "source-${SOURCE_ASSET}.tar.gz" velxio-qemu-source.tar.gz
              echo "No README contained the binary sha256; selecting newest corresponding-source archive: $SOURCE_ASSET ($LATEST_DATE)."
            fi
          fi

          if ! [[ "$SOURCE_ASSET" =~ ^qemu-source-[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::Invalid source_asset: $SOURCE_ASSET"
            exit 1
          fi

          echo "Using Velxio source asset: $SOURCE_ASSET"
          echo "source_asset=$SOURCE_ASSET" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SOURCE_ASSET" > VELXIO_QEMU_SOURCE_ASSET.txt

      - name: Download corresponding Velxio QEMU source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ASSET='${{ steps.source.outputs.source_asset }}'

          if [ ! -f velxio-qemu-source.tar.gz ]; then
            curl -fSL \
              -o velxio-qemu-source.tar.gz \
              "${VELXIO_DOWNLOAD_BASE}/${SOURCE_ASSET}?key=${VELXIO_LICENSE_KEY}"
          fi

          sha256sum velxio-qemu-source.tar.gz | tee VELXIO_QEMU_SOURCE_SHA256.txt
          tar -tzf velxio-qemu-source.tar.gz | sed -n '1,40p' | tee VELXIO_QEMU_SOURCE_HEAD.txt

          rm -rf qemu-velxio
          mkdir qemu-velxio
          tar -xzf velxio-qemu-source.tar.gz -C qemu-velxio --strip-components=1

          test -f qemu-velxio/build_libqemu-esp32.sh
          test -f qemu-velxio/hw/ssi/esp32_rmt.c

          if [ ! -f qemu-velxio/hw/ssi/esp32s3_gpspi.c ]; then
            echo "::error::Downloaded source does not look like the Velxio corresponding source tree (missing hw/ssi/esp32s3_gpspi.c)."
            exit 1
          fi
          grep -R -n -m1 'esp32s3-picsimlab' qemu-velxio/hw | tee VELXIO_MACHINE_CHECK.txt

      - name: Install QEMU build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl \
            python3-pip python3-setuptools \
            ninja-build pkg-config flex bison \
            libglib2.0-dev libgcrypt20-dev libslirp-dev \
            libpixman-1-dev libfdt-dev zlib1g-dev jq dpkg-dev

          python3 -m pip install --user 'meson==1.2.3' tomli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          LIBDIR="$(dpkg-architecture -q DEB_HOST_MULTIARCH)"
          sudo ar rcs "/usr/lib/${LIBDIR}/libiconv.a"

      - name: Inspect original ESP32 RMT terminator path
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 14 -E 'if[[:space:]]*\([[:space:]]*v[[:space:]]*==[[:space:]]*0|picsimlab_rmt_event' \
            qemu-velxio/hw/ssi/esp32_rmt.c \
            | tee RMT_BEFORE_PATCH.txt

      - name: Apply RMT frame-end patch
        shell: bash
        run: |
          set -euo pipefail
          cd qemu-velxio
          patch -p1 --forward < ../patches/qemu/esp32-rmt-forward-tx-terminator.patch

          grep -q 'picsimlab_rmt_event(channel, s->conf0\[channel\], 0);' \
            hw/ssi/esp32_rmt.c
          grep -n -C 14 -E 'if[[:space:]]*\([[:space:]]*v[[:space:]]*==[[:space:]]*0|picsimlab_rmt_event' \
            hw/ssi/esp32_rmt.c \
            | tee ../RMT_AFTER_PATCH.txt

      - name: Build shared library
        working-directory: qemu-velxio
        shell: bash
        run: |
          set -euo pipefail
          bash build_libqemu-esp32.sh

      - name: Verify artifact and Velxio callback ABI
        shell: bash
        run: |
          set -euo pipefail
          LIB=qemu-velxio/build/libqemu-xtensa.so
          test -f "$LIB"
          ls -lh "$LIB"
          file "$LIB" | tee LIBQEMU_FILE.txt
          file "$LIB" | grep -Eq 'ARM aarch64|aarch64'

          nm -D "$LIB" \
            | grep -E 'qemu_(init|main_loop|cleanup|picsimlab_register_callbacks|picsimlab_set_pin|picsimlab_uart_receive)' \
            | tee LIBQEMU_EXPORTS.txt

          grep -q 'qemu_picsimlab_register_callbacks' LIBQEMU_EXPORTS.txt
          strings "$LIB" | grep -m1 'esp32-picsimlab' | tee LIBQEMU_MACHINE.txt

      - name: Upload patched Velxio libqemu artifact
        uses: actions/upload-artifact@v4
        with:
          name: velxio-libqemu-xtensa-arm64-rmt-frame-end-${{ steps.source.outputs.source_asset }}
          path: |
            qemu-velxio/build/libqemu-xtensa.so
            VELXIO_QEMU_SOURCE_ASSET.txt
            VELXIO_REFERENCE_LIB_SHA256.txt
            VELXIO_QEMU_SOURCE_SHA256.txt
            VELXIO_QEMU_SOURCE_HEAD.txt
            VELXIO_SOURCE_README_SUMMARY.txt
            VELXIO_MACHINE_CHECK.txt
            LIBQEMU_FILE.txt
            LIBQEMU_EXPORTS.txt
            LIBQEMU_MACHINE.txt
            RMT_BEFORE_PATCH.txt
            RMT_AFTER_PATCH.txt
          if-no-files-found: error
          retention-days: 14
